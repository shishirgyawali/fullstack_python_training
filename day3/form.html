<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <body>
    <form action="" method="post" enctype="multipart/form-data">
      <table
        border="0"
        bgcolor="#fff4f3"
        align="center"
        width="40%"
        cellpadding="10"
        cellspacing="0"
      >
        <tr>
          <td colspan="2" align="center">
            <strong>
              <font size="4">Student Registration Form</font>
            </strong>
          </td>
        </tr>
        <tr>
          <td>
            <label for="rollno">Roll no:</label>
          </td>
          <td>
            <input type="text" id="rollno" name="rollno" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="firstname">Student Name:</label>
          </td>
          <td>
            <input
              type="text"
              id="firstname"
              name="firstname"
              placeholder="First Name"
              required
            />
            -
            <input
              type="text"
              id="lastname"
              name="lastname"
              placeholder="Last Name"
              required
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="fathername">Father's name:</label>
          </td>
          <td>
            <input type="text" id="fathername" name="fathername" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="day">Date of birth:</label>
          </td>
          <td>
            <input
              type="text"
              id="day"
              name="day"
              placeholder="DD"
              size="2"
              required
            />
            -
            <input
              type="text"
              id="month"
              name="month"
              placeholder="MM"
              size="2"
              required
            />
            -
            <input
              type="text"
              id="year"
              name="year"
              placeholder="YYYY"
              size="4"
              required
            />
            <i>
              <font size="2">(DD-MM-YYYY)</font>
            </i>
          </td>
        </tr>
        <tr>
          <td>
            <label for="countrycode">Mobile no:</label>
          </td>
          <td>
            <input
              type="text"
              id="countrycode"
              name="countrycode"
              placeholder="+977"
              size="2"
              required
            />
            <input
              type="text"
              id="mobile"
              name="mobile"
              placeholder="Mobile Number"
              required
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="email">Email id:</label>
          </td>
          <td>
            <input type="email" id="email" name="email" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="password">Password:</label>
          </td>
          <td>
            <input type="password" id="password" name="password" required />
          </td>
        </tr>
        <tr>
          <td>
            <label>Gender:</label>
          </td>
          <td>
            <input type="radio" id="male" name="gender" value="male" required />
            <label for="male">Male</label> &nbsp;&nbsp;
            <input
              type="radio"
              id="female"
              name="gender"
              value="female"
              required
            />
            <label for="female">Female</label>
          </td>
        </tr>
        <tr>
          <td>
            <label>Department:</label>
          </td>
          <td>
            <input type="checkbox" id="cse" name="department[]" value="CSE" />
            <label for="cse">CSE</label> &nbsp;
            <input type="checkbox" id="it" name="department[]" value="IT" />
            <label for="it">IT</label> &nbsp;
            <input type="checkbox" id="ece" name="department[]" value="ECE" />
            <label for="ece">ECE</label> &nbsp;
            <input
              type="checkbox"
              id="civil"
              name="department[]"
              value="Civil"
            />
            <label for="civil">Civil</label> &nbsp;
            <input type="checkbox" id="mech" name="department[]" value="Mech" />
            <label for="mech">Mech</label>
          </td>
        </tr>
        <tr>
          <td>
            <label for="course">Course:</label>
          </td>
          <td>
            <select id="course" name="course" required>
              <option value="" disabled selected>
                -------Select Current Courses-------
              </option>
              <option value="Course A">Course A</option>
              <option value="Course B">Course B</option>
              <option value="Course C">Course C</option>
              <option value="Course D">Course D</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <label for="photo">Student photo:</label>
          </td>
          <td>
            <input
              type="file"
              id="photo"
              name="photo"
              accept="image/*"
              required
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="city">City:</label>
          </td>
          <td>
            <input type="text" id="city" name="city" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="address">Address:</label>
          </td>
          <td>
            <textarea
              id="address"
              name="address"
              rows="3"
              cols="30"
              required
            ></textarea>
          </td>
        </tr>
        <tr>
          <td colspan="2" align="center">
            <button>Register</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
