<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

   

    <!--Google Font CDN-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!--Internal CSS Concept-->
    <style>
        *{
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 70px;
/*             margin-left: 3rem;
            margin-right: 3rem; */
            background-color: #F5F7FA;
            font-size: 16px;
            line-height: 24px;

        }
        ul {
            list-style: none;
            display: flex;
            gap: 4rem;
        }
        nav div a {
            margin-left: 4rem;
        }

        a{
            text-decoration: none;
            color: black;
        }

        #link{
            background-color: #4CAF50;
            border-radius: 6px;
            gap: 10px;
            padding: 10px 20px 10px 20px;
            color: white;
        }

        #login{
            background-color: #F5F7FA;
            border-radius: 6px;
            padding: 10px 20px 10px 20px;
            color: #4CAF50;
        }


        .hero {
            position: relative; /* Keeps the absolute dots locked inside this box */
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 2rem;
            background-color: #F5F7FA; /* This applies the grey background to the section */
            padding: 96px 144px 96px 144px; /* The 80px at the bottom reserves a designated empty spot for the dots */
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 32px;
            align-items: flex-start;

        }

        .hero-title {
            line-height: 76px;
            font-size: 64px;

        }

        /* Makes the color span drop neatly to its own styled green line */
        .hero-title span {
            color: #4CAF50;
            display: block;
        }

        .hero-subtitle {
            font-size: 16px;
            color: grey;
            line-height: 24px;
        }

        .dots-container {
            position: absolute;
            bottom: 24px;   /* Distance from the bottom edge of the hero block */
            left: 50%;      /* Moves container center-line to the middle */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .dot-active{
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
        }
        .dot{
            width: 10px;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 50%;
            cursor: pointer;
        }

        #register {
            background-color: #4CAF50;
            border-radius: 4px;
            padding: 14px 32px 14px 32px;
            color: white;
            display: inline-block;
            margin-top: 10px;
        }

        .clients{
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-left: 144px;
            padding-right: 144px;
            gap: 16px;
            margin-top: 35px;
        }

        .clients h1{
            font-size: 36px;
            line-height: 44px;
        }

        .clients p{
            font-size: 16px;
            line-height: 24px;
            color: grey;
        }








    </style>

</head>
<body>
    <nav width="100%">
        <img src="Logo.svg" alt="Logo" width="150px">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Service</a></li>
            <li><a href="#">Feature</a></li>
            <li><a href="#">Product</a></li>
            <li><a href="#">Testimonial</a></li>
            <li><a href="#">FAQ</a></li>

        </ul>

        <div>
            <a href="#" id="login">Login</a>
            <a href="#" id="link">Sign up</a>
        </div>
    </nav>
    
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Lessons and insights 
                <span>from 8 years</span>
            </h1>
            <p class="hero-subtitle">
                Where to grow your business as a photographer: site or social media?
            </p>
            
            <div class="register">
            <a href="#" id="register">Register</a>
            </div>

        </div>
        <div class="illustration"> 
            <img src="Illustration.svg" alt="Illustration" width="391px" height="407px">
        </div>
        <div class="dots-container">
            <span class="dot-active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </section>

    <section class="clients">
        <h1>Our Clients</h1>
        <p>We have been working with some Fortune 500+ clients</p>
        <img src="Clients Logos.svg"    alt="Clients Logos" width="1152px" height="98px">
    </section>


    <section class="community">
        
    </section>

</body>
</html>
