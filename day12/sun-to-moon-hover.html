<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun-to-Moon-Hover</title>
    <style>
      body {
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        height: 300px;
        width: 300px;
        border-radius: 50%;
        background-color: #ffd700;
        box-shadow: 0 0 40px 20px #ff4500;
        transition: all 0.6s ease-in-out;
        cursor: pointer;
      }

      .container:hover {
        background-color: transparent;
        box-shadow: -60px -40px 0 0 white inset;
        transform: scale(0.9);
      }
    </style>
  </head>
  <body>
    <div class="container"></div>
  </body>
</html>
