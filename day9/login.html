<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <style>
    body{font-family:Arial, sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#fff;padding:28px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);width:320px}
    input{width:100%;padding:10px 12px;margin-top:8px;border:1px solid #dcdfe6;border-radius:6px}
    button{margin-top:12px;width:100%;padding:10px;background:#1877f2;color:#fff;border:none;border-radius:6px;cursor:pointer}
    .links{margin-top:12px;text-align:center}
    a{color:#1877f2;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 8px">Log In</h2>
    <form id="loginForm">
      <label for="email">Email or phone</label>
      <input id="email" name="email" type="text" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Log In</button>
    </form>
    <div class="links">
      <div><a href="signup.html">Create new account</a></div>
      <div style="margin-top:6px"><a href="logout.html">Forgot password?</a></div>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      // static demo: redirect to homepage
      window.location.href = 'facebook_homepage_layout.html';
    });
  </script>
</body>
</html>
