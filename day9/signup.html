<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign Up</title>
  <style>
    body{font-family:Arial, sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#fff;padding:24px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);width:360px}
    input{width:100%;padding:10px 12px;margin-top:8px;border:1px solid #dcdfe6;border-radius:6px}
    button{margin-top:12px;width:100%;padding:10px;background:#42b72a;color:#fff;border:none;border-radius:6px;cursor:pointer}
    .links{margin-top:12px;text-align:center}
    a{color:#1877f2;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 8px">Create New Account</h2>
    <form id="signupForm">
      <input name="name" type="text" placeholder="Full name" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="New password" required>
      <button type="submit">Sign Up</button>
    </form>
    <div class="links">
      <div>Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e){
      e.preventDefault();
      // static demo: after signup, go to login
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
