<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-Index</title>
  </head>

  <style>
    .coordinate-system {
      position: relative;
      width: 400px;
      height: 400px;
      border: 1px solid rgb(201, 200, 200);
      margin: 20px auto;
    }

    .box {
      position: absolute;
      width: 80px;
      height: 80px;
    }

    .axis {
      position: absolute;
      background-color: rgb(21, 116, 194);
    }

    .y-axis {
      width: 2px;
      height: 100%;
      left: 50%;
      z-index: 5;
    }

    .x-axis {
      width: 100%;
      height: 2px;
      top: 50%;
      z-index: 10;
    }

    .z-axis {
      width: 2px;
      height: 100%;
      left: 50%;
      top: 0%;
      transform: rotate(135deg);
      z-index: 15;
    }

    #box-1 {
      background-color: #c1272d;
      left: 125px;
      top: 125px;
      z-index: -1;
    }

    #box-2 {
      background-color: #29abe2;
      left: 145px;
      top: 145px;
      z-index: 0;
    }

    #box-3 {
      background-color: #8cc63f;
      left: 165px;
      top: 165px;
      z-index: 1;
    }

    #box-4 {
      background-color: #ea7fb9;
      left: 185px;
      top: 185px;
      z-index: 2;
    }

    #box-5 {
      background-color: #e0bfe6;
      left: 205px;
      top: 205px;
      z-index: 3;
    }

    .box p {
      color: white;
      text-align: center;
      font-size: 15px;
      margin: 0;
    }
  </style>

  <body>
    <div class="coordinate-system">
      <div class="axis y-axis"></div>
      <div class="axis x-axis"></div>
      <div class="axis z-axis"></div>
      <div class="box" id="box-1">
        <p>z-index: -1</p>
      </div>
      <div class="box" id="box-2">
        <p>z-index: 0</p>
      </div>
      <div class="box" id="box-3">
        <p>z-index: 1</p>
      </div>
      <div class="box" id="box-4">
        <p>z-index: 2</p>
      </div>
      <div class="box" id="box-5">
        <p>z-index: 3</p>
      </div>
    </div>
  </body>
</html>
