<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Create Password</title>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body>
    <!--'justify-center' to vertically balance the page layout -->
    <div
      class="container min-h-screen w-screen flex flex-col items-center justify-center gap-8 bg-[#ffffff] mx-auto"
    >
      <div class="company-header">
        <img
          src="assets/desktop_login_email/company_logo/easymart.svg"
          alt="Company Logo"
        />
      </div>

      <div
        class="login-box w-[418px] flex flex-col p-6 border border-gray-100 rounded-xl shadow-sm"
      >
        <div class="box-header w-full mb-6 flex items-center gap-3">
          <a href="#" class="back-button hover:opacity-75 transition-opacity">
            <img
              src="assets/desktop_login_email/left-arrow.svg"
              alt="Back"
              class="w-5 h-5"
            />
          </a>
          <h2 class="font-poppins text-xl font-semibold text-gray-900">
            Create a password
          </h2>
        </div>

        <div class="input-password font-poppins mb-6">
          <label class="text-[12px] font-medium text-gray-600 block mb-1"
            >Password</label
          >
          <div class="relative w-full">
            <input
              class="border border-gray-300 text-xs w-full h-[52px] pl-[16px] pr-[40px] rounded-[8px] focus:outline-none focus:border-[#B6349A]"
              type="password"
              placeholder="Password"
            />
            <button
              type="button"
              class="absolute right-4 top-1/2 transform -translate-y-1/2 hover:opacity-75"
            ></button>
          </div>
        </div>

        <div
          class="submit-and-continue mb-6 w-full h-[46px] bg-[#B6349A] hover:bg-[#a02d88] transition-colors text-white rounded-[39px]"
        >
          <a
            href="#"
            class="flex items-center justify-center gap-2 w-full h-full font-poppins font-medium"
          >
            <span>Continue</span>
            <img
              src="assets/desktop_login_email/right-arrow-white.svg"
              alt="Right Arrow"
              class="inline"
            />
          </a>
        </div>

        <div
          class="password-rules font-poppins text-xs text-gray-500 flex flex-col gap-3 px-1"
        >
          <div class="rule-item flex items-center gap-2.5">
            <div class="w-1 h-1 rounded-full bg-gray-400"></div>
            <span>Must be at least 8 characters long</span>
          </div>
          <div class="rule-item flex items-center gap-2.5">
            <div class="w-1 h-1 rounded-full bg-gray-400"></div>
            <span>Include at least one uppercase letter (A-Z)</span>
          </div>
          <div class="rule-item flex items-center gap-2.5">
            <div class="w-1 h-1 rounded-full bg-gray-400"></div>
            <span>No spaces allowed</span>
          </div>
          <div class="rule-item flex items-center gap-2.5">
            <div class="w-1 h-1 rounded-full bg-gray-400"></div>
            <span>Include at least one number (0-9)</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
