<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyMart - Rate Your Order</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-[#F8F7FA] font-sans text-gray-800 antialiased relative selection:bg-[#B6349A] selection:text-white"
  >
    <!-- ========================================== -->
    <!-- 1. BACKGROUND PAGE LAYOUT (EasyMart Store) -->
    <!-- ========================================== -->
    <div class="min-h-screen flex flex-col">
      <!-- Header Navigation Bar -->
      <header
        class="w-full bg-white border-b border-gray-100 sticky top-0 z-20"
      >
        <div
          class="max-w-[1440px] mx-auto px-8 h-20 flex items-center justify-between gap-6"
        >
          <!-- Logo -->
          <div class="flex items-center gap-2 shrink-0">
            <div
              class="w-10 h-10 rounded-xl bg-[#B6349A] flex items-center justify-center text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
                />
              </svg>
            </div>
            <span class="text-2xl font-black tracking-tight text-[#B6349A]"
              >EasyMart</span
            >
          </div>

          <!-- Location Selector -->
          <div
            class="hidden lg:flex items-center gap-2 text-xs font-medium text-gray-600 bg-gray-50 border border-gray-200/60 px-4 py-2.5 rounded-full shrink-0"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4 text-[#B6349A]"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <span>10115 New York</span>
          </div>

          <!-- Search Bar -->
          <div class="flex-1 max-w-[540px] relative">
            <input
              type="text"
              placeholder="Search by product name, category..."
              class="w-full bg-gray-50/80 border border-gray-200/80 rounded-full pl-11 pr-4 py-2.5 text-xs text-gray-700 outline-none focus:border-[#B6349A] transition-colors"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </div>

          <!-- Actions (Cart & Login) -->
          <div class="flex items-center gap-3 shrink-0">
            <button
              class="flex items-center gap-2 bg-gray-50 border border-gray-200/80 hover:bg-gray-100 px-4 py-2 rounded-full text-xs font-semibold text-gray-700 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 text-[#B6349A]"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
                />
              </svg>
              <span
                class="bg-[#B6349A] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center"
                >14</span
              >
              <span>Cart</span>
            </button>

            <button
              class="flex items-center gap-2 border border-gray-200/80 hover:bg-gray-50 px-5 py-2 rounded-full text-xs font-semibold text-gray-700 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 text-gray-500"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
              <span>Login</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main
        class="max-w-[1440px] mx-auto px-8 py-6 flex-1 w-full flex flex-col gap-8 opacity-40 pointer-events-none select-none"
      >
        <!-- Promotional Banner Section -->
        <div
          class="w-full bg-[#FAF5F9] border border-[#f3e2ef] rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4"
        >
          <div class="flex items-center gap-4">
            <div
              class="w-12 h-12 rounded-2xl bg-[#B6349A] flex items-center justify-center text-white shrink-0"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-gray-900">Limited Time Over</h3>
              <p class="text-[11px] text-gray-500">
                Grab your daily essentials before the timer runs out!
              </p>
            </div>
          </div>

          <!-- Countdown Timer -->
          <div
            class="flex items-center gap-3 bg-white px-6 py-3 rounded-2xl border border-pink-100 shadow-xs"
          >
            <div class="flex flex-col items-center">
              <span class="text-xs font-bold text-gray-900">06</span>
              <span class="text-[9px] text-gray-400 uppercase">Hours</span>
            </div>
            <span class="text-gray-300 font-bold">:</span>
            <div class="flex flex-col items-center">
              <span class="text-xs font-bold text-gray-900">40</span>
              <span class="text-[9px] text-gray-400 uppercase">Minutes</span>
            </div>
            <span class="text-gray-300 font-bold">:</span>
            <div class="flex flex-col items-center">
              <span class="text-xs font-bold text-gray-900">32</span>
              <span class="text-[9px] text-gray-400 uppercase">Seconds</span>
            </div>
          </div>

          <button
            class="px-6 py-3 bg-[#B6349A] text-white rounded-full text-xs font-semibold shadow-sm"
          >
            Shop Now
          </button>
        </div>

        <!-- Categories Ribbon -->
        <div class="flex items-center gap-3 overflow-x-auto pb-2">
          <div
            class="flex items-center gap-2 bg-white border border-gray-200/80 px-4 py-2 rounded-full shrink-0 shadow-xs"
          >
            <span
              class="w-6 h-6 rounded-full bg-amber-100 flex items-center justify-center text-xs"
              >🍞</span
            >
            <span class="text-xs font-medium text-gray-700">Bread</span>
          </div>
          <div
            class="flex items-center gap-2 bg-white border border-gray-200/80 px-4 py-2 rounded-full shrink-0 shadow-xs"
          >
            <span
              class="w-6 h-6 rounded-full bg-yellow-100 flex items-center justify-center text-xs"
              >🧀</span
            >
            <span class="text-xs font-medium text-gray-700">Cheese</span>
          </div>
          <div
            class="flex items-center gap-2 bg-white border border-gray-200/80 px-4 py-2 rounded-full shrink-0 shadow-xs"
          >
            <span
              class="w-6 h-6 rounded-full bg-orange-100 flex items-center justify-center text-xs"
              >🍺</span
            >
            <span class="text-xs font-medium text-gray-700">Alcohol</span>
          </div>
          <div
            class="flex items-center gap-2 bg-white border border-gray-200/80 px-4 py-2 rounded-full shrink-0 shadow-xs"
          >
            <span
              class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-xs"
              >🥛</span
            >
            <span class="text-xs font-medium text-gray-700">Yogurt</span>
          </div>
          <div
            class="flex items-center gap-2 bg-white border border-gray-200/80 px-4 py-2 rounded-full shrink-0 shadow-xs"
          >
            <span
              class="w-6 h-6 rounded-full bg-red-100 flex items-center justify-center text-xs"
              >🍎</span
            >
            <span class="text-xs font-medium text-gray-700">Fruits</span>
          </div>
        </div>
      </main>
    </div>

    <!-- ========================================== -->
    <!-- 2. RATE-1 MODAL OVERLAY (Active State)    -->
    <!-- ========================================== -->
    <div
      class="fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-50 p-4"
    >
      <div
        class="w-full max-w-[460px] bg-white rounded-[32px] p-8 shadow-2xl flex flex-col gap-6 relative animate-in fade-in zoom-in duration-200"
      >
        <!-- Modal Header -->
        <div class="flex items-start justify-between">
          <div class="flex flex-col gap-1">
            <h2 class="text-lg font-bold text-gray-900 tracking-tight">
              Rate Your Order
            </h2>
            <p class="text-xs text-gray-400">Your feedback helps us improve!</p>
          </div>
          <button
            class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-900 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Product Thumbnails Grid -->
        <div class="flex items-center gap-3">
          <!-- Thumbnail 1 -->
          <div
            class="w-16 h-16 rounded-2xl bg-gray-50 border border-gray-100 overflow-hidden shrink-0 flex items-center justify-center p-2 shadow-xs"
          >
            <img
              src="https://images.unsplash.com/photo-1541518763669-27fef04b14ea?w=150"
              alt="Sandwich item"
              class="w-full h-full object-cover rounded-xl"
            />
          </div>
          <!-- Thumbnail 2 -->
          <div
            class="w-16 h-16 rounded-2xl bg-gray-50 border border-gray-100 overflow-hidden shrink-0 flex items-center justify-center p-2 shadow-xs"
          >
            <img
              src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=150"
              alt="Burger item"
              class="w-full h-full object-cover rounded-xl"
            />
          </div>
          <!-- Thumbnail 3 -->
          <div
            class="w-16 h-16 rounded-2xl bg-gray-50 border border-gray-100 overflow-hidden shrink-0 flex items-center justify-center p-2 shadow-xs"
          >
            <img
              src="https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=150"
              alt="Pizza item"
              class="w-full h-full object-cover rounded-xl"
            />
          </div>
        </div>

        <!-- Interactive Outline Star Rating Row -->
        <div class="flex items-center gap-2 pt-1 text-[#B6349A]">
          <!-- Star 1 -->
          <button
            class="hover:scale-110 transition-transform focus:outline-none"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-7 h-7"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
              />
            </svg>
          </button>
          <!-- Star 2 -->
          <button
            class="hover:scale-110 transition-transform focus:outline-none"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-7 h-7"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
              />
            </svg>
          </button>
          <!-- Star 3 -->
          <button
            class="hover:scale-110 transition-transform focus:outline-none"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-7 h-7"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
              />
            </svg>
          </button>
          <!-- Star 4 -->
          <button
            class="hover:scale-110 transition-transform focus:outline-none"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-7 h-7"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
              />
            </svg>
          </button>
          <!-- Star 5 -->
          <button
            class="hover:scale-110 transition-transform focus:outline-none"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-7 h-7"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
