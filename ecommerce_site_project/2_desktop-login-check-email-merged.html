<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Login - Check Email Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body>
    <div class="container min-h-screen w-screen flex flex-col items-center justify-center gap-8 bg-[#ffffff] mx-auto">
      <div class="company-header">
        <img src="assets/desktop_login_email/company_logo/easymart.svg" alt="Company Logo" />
      </div>

      <div class="login-box w-[418px] flex flex-col p-8 border border-gray-100 rounded-xl shadow-sm relative">
        <!-- Back Arrow Header -->
        <div class="box-header w-full flex justify-start mb-2">
          <a href="#" class="p-1 -ml-1 hover:bg-gray-50 rounded-full transition-colors">
            <img src="assets/desktop_login_email/left-arrow.svg" alt="Back" class="w-5 h-5" />
          </a>
        </div>

        <!-- Title & Instruction -->
        <div class="text-center mb-6">
          <h2 class="font-poppins text-[22px] font-semibold text-gray-900 mb-2">
            Check your email
          </h2>
          <p class="font-poppins text-sm text-gray-500 leading-relaxed">
            We sent a 6-digit code to<br />
            <span class="font-medium text-gray-800">georgia.young@example.com</span>
          </p>
        </div>

        <!-- OTP Input Fields -->
        <div class="otp-inputs flex justify-center gap-4 mb-8" id="otp-container">
          <input
            type="text"
            maxlength="1"
            class="otp-input w-14 h-14 border border-gray-200 bg-gray-50 rounded-xl text-center text-xl font-poppins font-medium text-gray-800 focus:outline-none focus:border-[#B6349A] focus:bg-white transition-colors"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input w-14 h-14 border border-gray-200 bg-gray-50 rounded-xl text-center text-xl font-poppins font-medium text-gray-800 focus:outline-none focus:border-[#B6349A] focus:bg-white transition-colors"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input w-14 h-14 border border-gray-200 bg-gray-50 rounded-xl text-center text-xl font-poppins font-medium text-gray-800 focus:outline-none focus:border-[#B6349A] focus:bg-white transition-colors"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input w-14 h-14 border border-gray-200 bg-gray-50 rounded-xl text-center text-xl font-poppins font-medium text-gray-800 focus:outline-none focus:border-[#B6349A] focus:bg-white transition-colors"
          />
        </div>

        <!-- Resend Code -->
        <div class="resend-code text-center w-full">
          <p class="font-poppins text-sm text-gray-500">
            Haven't received your code?
            <a href="#" class="text-[#B6349A] font-medium hover:underline ml-1">Request a New Code</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Script to handle automatic "Filled" state transitions -->
    <script>
      const inputs = document.querySelectorAll('.otp-input');

      inputs.forEach((input, index) => {
        // Move to the next field automatically when a number is typed
        input.addEventListener('input', (e) => {
          if (e.target.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
          // Optionally dynamically change classes based on if it has a value
          if (e.target.value !== "") {
            e.target.classList.add('bg-white', 'border-[#B6349A]', 'text-gray-800');
            e.target.classList.remove('bg-gray-50', 'border-gray-200');
          } else {
            e.target.classList.remove('bg-white', 'border-[#B6349A]', 'text-gray-800');
            e.target.classList.add('bg-gray-50', 'border-gray-200');
          }
        });

        // Move to the previous field automatically when backspace is hit on an empty field
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });
    </script>
  </body>
</html>
