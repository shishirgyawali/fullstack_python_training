<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyMart - Cancel Order Reason Modal</title>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body class="bg-[#ffffff] font-poppins text-gray-900 overflow-x-hidden relative">
    
    <!-- Background Wrapper (Dimmed / Blurred to simulate active modal state) -->
    <div class="min-h-screen w-screen flex flex-col bg-white opacity-40 pointer-events-none select-none">
      
      <!-- Top Global Header -->
      <header class="w-full h-24 border-b border-gray-100 flex items-center justify-between px-12 bg-white shrink-0">
        <div class="flex items-center gap-12">
          <img src="assets/desktop_login_email/company_logo/easymart.svg" alt="EasyMart Logo" class="h-8 w-auto object-contain" />
          <div class="flex items-center gap-2 text-xs text-gray-700 bg-gray-50/80 px-4 py-2.5 rounded-full border border-gray-100">
            <img src="assets/nav/Location.svg" alt="Location" class="w-4 h-4 text-gray-500" />
            <span class="font-medium">10115 New York</span>
          </div>
        </div>

        <div class="relative w-[380px]">
          <span class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
            <img src="assets/nav/search.svg" alt="Search" class="w-4 h-4 opacity-40" />
          </span>
          <input type="text" placeholder="Search by..." class="w-full pl-11 pr-4 py-3 bg-gray-50/50 border border-gray-100 rounded-full text-xs font-medium text-gray-800 outline-none" />
        </div>

        <div class="flex items-center gap-4">
          <a href="#" class="flex items-center gap-2 px-4 py-2.5 bg-[#fdf2fa] text-[#B6349A] rounded-full text-xs font-medium">
            <span class="bg-[#B6349A] text-white text-[10px] px-1.5 py-0.5 rounded-full font-semibold">14</span>
            <span>Cart</span>
          </a>
          <a href="#" class="flex items-center gap-2 px-5 py-2.5 border border-gray-200 rounded-full text-xs font-medium text-gray-800">
            <img src="assets/nav/login.svg" alt="User" class="w-4 h-4 opacity-60" />
            <span>Login</span>
          </a>
        </div>
      </header>

      <!-- Sub Header Navigation Bar -->
      <div class="w-full max-w-[1440px] mx-auto px-12 py-6 flex items-center justify-between">
        <a href="#" class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </a>
        <a href="#" class="flex items-center gap-2 px-5 py-2.5 border border-gray-200 rounded-full text-xs font-medium text-gray-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>Help</span>
        </a>
      </div>

      <!-- Main Order Details Content -->
      <main class="w-full max-w-[1440px] mx-auto px-12 pb-16 grid grid-cols-12 gap-8 items-start">
        
        <!-- Left Column: Status & Items -->
        <div class="col-span-8 flex flex-col gap-6">
          <div class="border border-gray-100 rounded-[28px] p-8 bg-white shadow-xs flex flex-col gap-6">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-sm font-bold text-gray-900 mb-1">Order In Progress</h2>
                <p class="text-[11px] text-gray-400">Order Arrived at Apr 5, 2022, 10:07 AM</p>
              </div>
              <span class="px-4 py-1.5 bg-[#fdf2fa] text-[#B6349A] rounded-full text-[11px] font-semibold">In Progress</span>
            </div>
          </div>
        </div>

        <!-- Right Column: Summary & Actions -->
        <div class="col-span-4 flex flex-col gap-6">
          <div class="border border-gray-100 rounded-[28px] p-8 bg-white shadow-xs flex flex-col gap-4">
            <h3 class="text-xs font-bold text-gray-900 mb-1">Order Summary</h3>
            <div class="flex items-center justify-between text-xs text-gray-500">
              <span>Order Number</span>
              <span class="font-semibold text-gray-800">#123-321</span>
            </div>
            <div class="flex items-center justify-between text-xs text-gray-500">
              <span>Total</span>
              <span class="font-bold text-gray-900">$144</span>
            </div>
          </div>
          <button class="w-full py-4 border border-gray-300 rounded-full text-xs font-semibold text-gray-800 bg-white shadow-xs">
            Cancel Order
          </button>
        </div>

      </main>

    </div>

    <!-- Active Cancel Order Modal Overlay with Selected Reason & Buttons -->
    <div class="fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-50 p-4">
      
      <!-- Modal Box Container -->
      <div class="w-full max-w-[580px] bg-white rounded-[32px] p-8 shadow-2xl flex flex-col gap-6 relative animate-in fade-in zoom-in duration-200">
        
        <!-- Modal Header -->
        <div class="flex items-center justify-between">
          <h2 class="text-base font-bold text-gray-900">Why do you want to cancel the order?</h2>
          <button class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-gray-900 transition-colors" title="Close Modal">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Radio Options List -->
        <div class="flex flex-col gap-4 py-2">
          
          <!-- Option 1: Unselected -->
          <label class="flex items-center gap-3.5 cursor-pointer group">
            <input type="radio" name="cancel_reason" class="w-4 h-4 accent-[#B6349A] cursor-pointer" />
            <span class="text-xs font-medium text-gray-800 group-hover:text-gray-900">Changed My Mind</span>
          </label>

          <!-- Option 2: Selected ("Shipping Time Too Long") -->
          <label class="flex items-center gap-3.5 cursor-pointer group">
            <input type="radio" name="cancel_reason" checked class="w-4 h-4 accent-[#B6349A] cursor-pointer" />
            <span class="text-xs font-medium text-gray-800 group-hover:text-gray-900">Shipping Time Too Long</span>
          </label>

          <!-- Option 3: Unselected -->
          <label class="flex items-center gap-3.5 cursor-pointer group">
            <input type="radio" name="cancel_reason" class="w-4 h-4 accent-[#B6349A] cursor-pointer" />
            <span class="text-xs font-medium text-gray-800 group-hover:text-gray-900">The Delivery Time is Too Late</span>
          </label>

          <!-- Option 4: Unselected -->
          <label class="flex items-center gap-3.5 cursor-pointer group">
            <input type="radio" name="cancel_reason" class="w-4 h-4 accent-[#B6349A] cursor-pointer" />
            <span class="text-xs font-medium text-gray-800 group-hover:text-gray-900">Other</span>
          </label>

        </div>

        <!-- Modal Action Buttons Footer -->
        <div class="flex items-center gap-4 pt-2">
          <!-- Secondary Action: No, I Need the Order -->
          <button class="flex-1 py-3.5 border border-gray-300 hover:border-gray-400 rounded-full text-xs font-semibold text-gray-800 transition-colors bg-white shadow-2xs">
            No, I Need the Order
          </button>

          <!-- Primary Action: Yes Cancel the order -->
          <button class="flex-1 py-3.5 bg-[#B6349A] hover:bg-[#a02d88] text-white rounded-full text-xs font-semibold transition-colors shadow-sm">
            Yes Cancel the order
          </button>
        </div>

      </div>

    </div>

  </body>
</html>
